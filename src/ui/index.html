<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor Library</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <a class="brand" href="#/">
      <img class="brand-logo" src="/logo.png" alt="">
      <span class="brand-text"><b data-t="appName">Noor Library</b><small data-t="tagline"></small></span>
    </a>
    <nav id="nav-main"></nav>
    <div class="nav-label"><span data-t="navLibrary"></span></div>
    <nav id="nav-library"></nav>
    <div class="nav-label"><span data-t="navSources"></span> <button class="nav-add" id="add-source"></button></div>
    <nav id="nav-sources" class="scroll"></nav>
    <nav id="nav-bottom"></nav>
  </aside>

  <section id="main">
    <header id="topbar">
      <label class="search">
        <span class="search-icon"></span>
        <input id="search" type="search" autocomplete="off" spellcheck="false">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="top-right">
        <div id="job" class="job" hidden>
          <span class="spinner"></span>
          <span id="job-text"></span>
          <button id="job-stop" class="job-stop"></button>
        </div>
        <button id="lang-toggle" class="lang-toggle"></button>
        <a class="icon-btn" href="#/settings/sources" id="top-settings"></a>
      </div>
      <div id="progress"><div id="progress-bar"></div></div>
    </header>
    <div id="page" tabindex="-1"></div>
    <div id="player" class="player" hidden></div>
  </section>
</div>

<button id="fab" class="fab"></button>
<div id="assistant" class="assistant" hidden></div>
<div id="overlay-root"></div>
<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
