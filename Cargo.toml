[package]
name = "noor-library"
version = "0.1.0"
edition = "2021"
description = "Noor Library: an Islamic lecture, series and Quran library for servers, folders, YouTube and podcasts"
build = "build.rs"

[lib]
name = "noor"
path = "src/lib.rs"

# Command-line interface.
[[bin]]
name = "noor"
path = "src/main.rs"

# Desktop app: the web UI in a native window.
[[bin]]
name = "noor-library"
path = "src/desktop.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", features = ["gzip", "json"] }
rfd = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
roxmltree = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
url = "2"
wry = "0.57"

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
