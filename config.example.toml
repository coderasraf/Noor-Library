# Noor Library configuration. The desktop app writes this file for you
# (%APPDATA%\NoorLibrary\config.toml); hand edits are fine too.
#
# !! KEY ORDER MATTERS !!
# Every bare key (db_path, concurrency, media_extensions, skip_dirs, ...) must
# come BEFORE the first [table] or [[roots]] header. In TOML a bare key
# belongs to the most recent header above it, so `skip_dirs = [...]` written
# below [[roots]] becomes a field of that root, not a top-level setting.

# SQLite file holding the library, play history and crawl checkpoints.
db_path = "noor.db"

# Folder pages fetched in parallel. Keep this modest on a home server.
concurrency = 6

# Pause between folder levels, in milliseconds.
delay_ms = 50

# Per-request timeout, in seconds.
timeout_secs = 20

# Maximum folder depth below a source.
max_depth = 12

# File types to index (audio and video).
media_extensions = [
  "mp3", "m4a", "aac", "ogg", "opus", "wav", "flac", "wma", "amr",
  "mp4", "m4v", "mkv", "webm", "avi", "mov", "wmv", "flv", "3gp", "ts", "mpg", "mpeg",
]

# Folders to skip (case-insensitive substring match on the folder name).
skip_dirs = []

[ui]
# "bn" (Bangla) or "en" (English).
language = "bn"

[player]
# Used for formats the built-in player can't play, or for everything when
# external_only = true. {url} is replaced with the media URL.
command = "vlc"
args = ["--play-and-exit", "{url}"]
external_only = false

[youtube]
# YouTube Data API v3 key; needed only for YouTube sources.
api_key = ""

[assistant]
# Gemini API key from https://aistudio.google.com/apikey (optional).
api_key = ""
model = "gemini-flash-latest"

# One block per source. Give exactly one of url / path / youtube / feed.
# kind is "lectures", "series" or "quran".

# A server folder link (an HTTP directory listing).
[[roots]]
name = "Waz Mahfil"
url = "http://192.168.1.10/Islamic/Waz/"
kind = "lectures"
speaker_folders = true      # Waz/<Speaker name>/<talk>.mp3

# A folder on this PC.
[[roots]]
name = "Tafsir"
path = 'D:\Islamic\Tafsir'
kind = "series"
speaker = "Shaykh Ahmadullah"

# A Quran recitation (files or folders named by surah number).
[[roots]]
name = "Mishary Alafasy"
url = "https://server8.mp3quran.net/afs/"
kind = "quran"
speaker = "Mishary Rashid Alafasy"

